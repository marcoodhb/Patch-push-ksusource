name: Patch Kernel with KernelSU

on:
  workflow_dispatch:
    inputs:
      KERNEL_GIT:
        description: 'Link to the private kernel repository:'
        required: true
      KERNEL_GIT_BRANCH:
        description: 'Branch of the original kernel:'
        required: true
      KSU_GIT:
        description: 'Link to KernelSU repository:'
        required: false
        default: 'https://github.com/KernelSU-Next/KernelSU-Next.git'
      KSU_GIT_BRANCH:
        description: 'Branch of KernelSU:'
        required: false
        default: 'next'
      TARGET_REPO_URL:
        description: 'URL of the target repository (e.g., github.com/user/repo.git):'
        required: true
      TARGET_BRANCH:
        description: 'Target branch to push to:'
        required: true

jobs:
  patch_kernel:
    name: Patch and Push Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Repository String
        id: repo_prep
        run: |
          REPO_URL="${{ github.event.inputs.KERNEL_GIT }}"
          REPO_PATH=${REPO_URL#https://github.com/}
          REPO_PATH=${REPO_PATH%.git}
          echo "repo_path=${REPO_PATH}" >> $GITHUB_OUTPUT

      - name: Clone Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repo_prep.outputs.repo_path }}
          token: ${{ secrets.CLONE_TOKEN }}
          ref: ${{ github.event.inputs.KERNEL_GIT_BRANCH }}
          path: 'kernel-src'
          fetch-depth: 0

      - name: Setup Build Environment
        run: |
          # Enable source repositories ('deb-src'), which are required for 'apt build-dep'
          sudo sed -Ei 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -y

      - name: Build and Install Coccinelle
        run: |
          sudo apt-get build-dep -y coccinelle
          git clone --depth=1 https://github.com/coccinelle/coccinelle.git
          cd coccinelle
          ./autogen && ./configure && make -j$(nproc --all) && sudo make install
          cd .. && rm -rf coccinelle

      - name: Update Submodules
        working-directory: kernel-src
        run: git submodule update --init --recursive || true

      - name: Patch KernelSU
        working-directory: kernel-src
        run: |
          set -e
          rm -rf KernelSU .git/modules/KernelSU
          git config -f .gitmodules --remove-section submodule.KernelSU 2>/dev/null || true
          [ -L "drivers/kernelsu" ] && rm "drivers/kernelsu"
          grep -q "kernelsu" "./drivers/Makefile" && sed -i '/kernelsu/d' "./drivers/Makefile"
          grep -q "drivers/kernelsu/Kconfig" "./drivers/Kconfig" && sed -i '/drivers\/kernelsu\/Kconfig/d' "./drivers/Kconfig"
          
          git clone --depth=1 -b ${{ github.event.inputs.KSU_GIT_BRANCH }} "${{ github.event.inputs.KSU_GIT }}" KernelSU
          rm -rf KernelSU/.git

          ln -sf ../KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" "./drivers/Makefile" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "./drivers/Makefile"
          grep -q "source \"drivers/kernelsu/Kconfig\"" "./drivers/Kconfig" || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" "./drivers/Kconfig"

      - name: Apply Scope-Minimized Hooks
        working-directory: kernel-src
        run: |
          git clone --depth=1 https://github.com/marcoodhb/kernelsu-coccinelle.git
          bash -x ./kernelsu-coccinelle/scope-minimized-hooks/apply.sh .
          rm -rf kernelsu-coccinelle
          rm -rf android/abi_gki_protected_exports* || true

      - name: Commit and Push Changes
        working-directory: kernel-src
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add .
          
          if git diff-index --quiet HEAD; then
            echo "No changes to commit. Nothing to push."
          else
            git commit -m "Patch KernelSU & minimized hooks"
            git push https://x-access-token:${{ secrets.CLONE_TOKEN }}@${{ github.event.inputs.TARGET_REPO_URL }} HEAD:refs/heads/${{ github.event.inputs.TARGET_BRANCH }} --force
          fi
